<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <meta charset="UTF-8">
    <title>Users</title>
</head>
<body>
<main layout:fragment="content">
    <div class="container">
        <h1>Users</h1>
        <ul>
            <li th:each="user : ${users}"
                th:text="${user.givenName + ' ' + user.familyName}"></li>
            </li>
        </ul>
    </div>
</main>
</body>
</html>
