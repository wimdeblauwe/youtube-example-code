<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Users</title>
    <link rel="stylesheet" th:href="@{/css/application.css}">
</head>
<body>
<div>
    <h1>Users</h1>
    <ul>
        <li th:each="user : ${users}"
            th:text="${user.givenName + ' ' + user.familyName}">
        </li>
    </ul>
</div>
</body>
</html>
