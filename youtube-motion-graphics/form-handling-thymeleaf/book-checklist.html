<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Book checklist callout</title>
<!--
  Transparent overlay for take-29 (full-frame camera), right side of the frame.
  "if you want to learn how to make the input form red / have nicer messages / add a summary at the top
  of the form" builds a 3-item checklist with mini before→after examples; on "check out my book" the
  checklist folds into the Taming Thymeleaf cover, then title card and link follow.
  Clip time follows the finished video: take-29 11.5 → 16.37, (cut) 16.51 → 20.37, (cut) 24.44 → 27.08.
  Open in a browser to preview (click to replay); add ?bg to see it over the camera frame.
-->
<style>
  @font-face { font-family: "Barlow"; font-weight: 700; src: url("../assets/fonts/barlow-700.woff2") format("woff2"); }
  @font-face { font-family: "Barlow"; font-weight: 800; src: url("../assets/fonts/barlow-800.woff2") format("woff2"); }
  @font-face { font-family: "Geist Mono"; font-weight: 400; src: url("../assets/fonts/geist-mono-400.woff2") format("woff2"); }
  @font-face { font-family: "Geist Mono"; font-weight: 500; src: url("../assets/fonts/geist-mono-500.woff2") format("woff2"); }
  @font-face { font-family: "Hanken Grotesk"; font-weight: 500; src: url("../assets/fonts/hanken-grotesk-500.woff2") format("woff2"); }
  @font-face { font-family: "Hanken Grotesk"; font-weight: 600; src: url("../assets/fonts/hanken-grotesk-600.woff2") format("woff2"); }
  :root { --navy: #13202f; --copper: #c2702e; --copper-bright: #e08a4e; --on-navy: #f0ece5;
    --paper: #faf9f5; --ink: #13202f; --line: #d6d0c4; --err: #c8423b; --err-bg: #fbeceb; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  body.bg { background: url("../out/stills/t29-cam.png") 0 0 / 1920px 1080px; }
  .abs { position: absolute; }

  /* checklist card */
  #list { left: 1450px; top: 150px; width: 430px; padding: 22px 24px 8px; border-radius: 18px;
    background: rgba(19,32,47,.93); box-shadow: 0 30px 60px -20px rgba(0,0,0,.6); color: var(--on-navy);
    transform-origin: 70% 30%; }
  #list .k { font: 500 15px "Geist Mono"; letter-spacing: .16em; color: rgba(240,236,229,.62); margin-bottom: 14px; }
  .item { display: flex; gap: 14px; padding: 14px 0 16px; border-top: 1px solid rgba(240,236,229,.1); }
  .chk { flex: none; width: 28px; height: 28px; border-radius: 50%; margin-top: 2px; position: relative;
    border: 2px solid rgba(240,236,229,.3); }
  .chk b { position: absolute; inset: -2px; border-radius: 50%; background: var(--copper);
    display: grid; place-items: center; color: #fff; font: 700 16px "Hanken Grotesk"; }
  .body { flex: 1; min-width: 0; }
  .cap { font: 700 24px "Barlow"; letter-spacing: -.01em; margin-bottom: 10px; }
  .mini { background: var(--paper); color: var(--ink); border-radius: 10px; padding: 12px 14px; position: relative; overflow: hidden; }
  .mini label { display: block; font: 500 12px "Hanken Grotesk"; color: #5b6673; margin-bottom: 4px; }
  .in { height: 34px; border: 2px solid var(--line); border-radius: 7px; background: #fff; }
  .msg { position: relative; height: 22px; font: 500 15px/22px "Hanken Grotesk"; }
  .msg span { position: absolute; left: 0; top: 0; white-space: nowrap; }
  .msg .old { font: 400 14px/22px "Geist Mono"; color: #6b7480; }
  .msg .new { color: var(--err); font-weight: 600; }
  .sum { border-radius: 7px; background: var(--err-bg); border: 1.5px solid #e9b4b0; padding: 7px 10px; margin-bottom: 8px;
    font: 600 13px/1.35 "Hanken Grotesk"; color: var(--err); }
  .sum div { font-weight: 500; color: #8a3a35; }
  .bar { height: 10px; border-radius: 5px; background: #e6e1d7; margin: 6px 0; }
  .bar.s { width: 60%; }

  /* book */
  #glow { left: 1300px; top: 110px; width: 720px; height: 760px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(224,138,78,.45), rgba(224,138,78,.12) 55%, transparent); }
  #book { left: 1490px; top: 140px; width: 360px; height: 470px; perspective: 1400px; }
  #cover { position: absolute; inset: 0; border-radius: 6px; overflow: hidden;
    box-shadow: 0 40px 70px -20px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.08); }
  #cover img { width: 100%; height: 100%; display: block; }
  #sweep { position: absolute; top: -10%; bottom: -10%; left: 0; width: 140px;
    background: linear-gradient(90deg, transparent, rgba(255,240,225,.55), transparent); }
  #card { left: 1460px; width: 420px; top: 650px; padding: 20px 26px 22px; border-radius: 16px;
    background: rgba(19,32,47,.92); box-shadow: 0 24px 50px -18px rgba(0,0,0,.6); color: var(--on-navy); }
  #card h3 { font: 800 40px/1.02 "Barlow"; letter-spacing: -.03em; }
  #card h3 em { font-style: normal; color: var(--copper-bright); }
  #card .k { margin-top: 10px; font: 500 15px "Geist Mono"; letter-spacing: .14em; color: rgba(240,236,229,.62); }
  #url { margin-top: 14px; display: inline-block; padding: 6px 12px; border-radius: 8px;
    background: var(--copper); color: #fff; font: 500 16px "Geist Mono"; }
</style>
</head>
<body>
<div id="list" class="abs">
  <div class="k">LEVEL UP YOUR FORMS</div>
  <div class="item" id="i1"><div class="chk"><b>✓</b></div><div class="body">
    <div class="cap">Highlight invalid fields</div>
    <div class="mini"><label>Given name</label><div class="in" id="in1"></div></div></div></div>
  <div class="item" id="i2"><div class="chk"><b>✓</b></div><div class="body">
    <div class="cap">Friendlier messages</div>
    <div class="mini"><div class="msg"><span class="old" id="old">must not be blank</span>
      <span class="new" id="new">Please fill in your given name</span></div></div></div></div>
  <div class="item" id="i3"><div class="chk"><b>✓</b></div><div class="body">
    <div class="cap">Error summary on top</div>
    <div class="mini"><div class="sum" id="sum">2 problems with this form<div>· Given name · Family name</div></div>
      <div class="bar s"></div><div class="bar"></div><div class="bar s"></div><div class="bar"></div></div></div></div>
</div>
<div id="glow" class="abs"></div>
<div id="book" class="abs"><div id="cover"><img src="../assets/taming-thymeleaf-cover.png" alt=""><div id="sweep"></div></div></div>
<div id="card" class="abs">
  <h3>Taming <em>Thymeleaf</em></h3>
  <div class="k">4TH EDITION · SPRING BOOT 4</div>
  <div id="url">leanpub.com/taming-thymeleaf</div>
</div>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  if (params.has('bg')) document.body.classList.add('bg');
  // take-29 seconds → clip ms, skipping the cut stretches 16.37–16.51 and 20.37–24.44
  const T = (t) => Math.round((t <= 16.37 ? t - 11.5 : t <= 20.37 ? t - 11.64 : 8.73 + t - 24.44) * 1000);
  window.CLIP_DURATION = T(27.08);
  const out = 'cubic-bezier(0.23, 1, 0.32, 1)', inOut = 'cubic-bezier(0.65, 0, 0.35, 1)';
  const $ = (id) => document.getElementById(id);
  const anim = (el, kf, start, dur, easing = out, fill = 'both') => el.animate(kf, { delay: start, duration: dur, easing, fill });
  const rise = (el, t, dy = 16) => anim(el, [{ opacity: 0, transform: `translateY(${dy}px)` }, { opacity: 1, transform: 'none' }], t, 500);
  const tick = (item, t) => anim(item.querySelector('.chk b'), [{ transform: 'scale(0)', opacity: 0 }, { transform: 'scale(1.15)', opacity: 1, offset: .6 }, { transform: 'scale(1)', opacity: 1 }], t, 380);
  const tExit = window.CLIP_DURATION - 450;

  // "learn how to": the card slides in
  anim($('list'), [{ opacity: 0, transform: 'translateX(60px)' }, { opacity: 1, transform: 'none' }], T(12.05) - 150, 600);
  // 1 "make the input form red"
  rise($('i1'), T(12.37));
  anim($('in1'), [{ borderColor: '#d6d0c4', background: '#ffffff' }, { borderColor: '#c8423b', background: '#fbeceb' }], T(13.41), 250, 'ease-out');
  anim($('in1'), [{ transform: 'translateX(0)' }, { transform: 'translateX(-6px)', offset: .2 }, { transform: 'translateX(6px)', offset: .45 },
    { transform: 'translateX(-3px)', offset: .7 }, { transform: 'translateX(0)' }], T(13.41), 380, 'ease-out', 'none');
  tick($('i1'), T(13.6));
  // 2 "nicer messages"
  rise($('i2'), T(13.97));
  anim($('old'), [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(-12px)' }], T(14.4), 300, 'ease-in', 'forwards');
  anim($('new'), [{ opacity: 0, transform: 'translateY(12px)' }, { opacity: 1, transform: 'none' }], T(14.5), 400);
  tick($('i2'), T(14.75));
  // 3 "a summary ... at the top of the form"
  rise($('i3'), T(15.81));
  anim($('sum'), [{ opacity: 0, transform: 'translateY(-26px)', marginBottom: '-44px' }, { opacity: 1, transform: 'none', marginBottom: '8px' }], T(16.0), 550);
  anim($('sum'), [{ boxShadow: '0 0 0 0 rgba(200,66,59,.5)' }, { boxShadow: '0 0 0 6px rgba(200,66,59,0)' }], T(17.49), 600, 'ease-out', 'none');
  tick($('i3'), T(17.75));

  // "check out my book": the checklist folds into the cover
  anim($('list'), [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translate(40px,-20px) scale(.55)' }], T(18.29), 450, 'cubic-bezier(0.55, 0, 1, 0.45)', 'forwards');
  anim($('glow'), [{ opacity: 0, transform: 'scale(.7)' }, { opacity: 1, transform: 'scale(1)' }], T(18.45), 700, 'ease-out');
  anim($('cover'), [
    { transform: 'translateX(220px) rotateY(-55deg) rotateZ(4deg)', opacity: 0 }, { opacity: 1, offset: .35 },
    { transform: 'translateX(0) rotateY(-14deg) rotateZ(0deg)', opacity: 1 }], T(18.55), 800);
  anim($('cover'), [{ transform: 'translateX(0) rotateY(-14deg) translateY(0)' }, { transform: 'translateX(0) rotateY(-10deg) translateY(-8px)' }],
    T(18.55) + 800, tExit - T(18.55) - 800, 'ease-in-out', 'forwards');
  // "Taming Thymeleaf"
  anim($('sweep'), [{ transform: 'translateX(-160px) skewX(-18deg)' }, { transform: 'translateX(460px) skewX(-18deg)' }], T(19.09), 700, inOut);
  anim($('card'), [{ opacity: 0, transform: 'translateY(30px)' }, { opacity: 1, transform: 'none' }], T(19.09), 600);
  // "clear examples"
  anim($('url'), [{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], T(24.69), 450);
  [$('glow'), $('book'), $('card')].forEach((e) => anim(e, [{ opacity: 1 }, { opacity: 0 }], tExit, 450, 'ease-in', 'forwards'));

  const all = () => document.getAnimations();
  window.seek = (ms) => all().forEach((a) => { a.pause(); a.currentTime = ms; });
  const img = document.querySelector('#cover img');
  window.ready = Promise.all([document.fonts.ready, img.decode()]).then(async () => {
    await Promise.all([...document.fonts].map((f) => f.load()));
    if (params.has('render')) { window.seek(0); return; }
    if (params.has('t')) { window.seek(Number(params.get('t'))); return; }
    document.body.addEventListener('click', () => all().forEach((a) => { a.currentTime = 0; a.play(); }));
  });
})();
</script>
</body>
</html>
